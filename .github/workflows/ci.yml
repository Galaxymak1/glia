name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows is best effort.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci reads the lockfile, which loses better-sqlite3's gypfile:false, so it tries
      # node-gyp, which cannot find the runner's Visual Studio. The package ships prebuilds.
      - run: npm ci ${{ matrix.os == 'windows-latest' && '--ignore-scripts' || '' }}
      - run: npm run typecheck
      - run: npx vitest run --testTimeout 30000

  fresh-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: bash scripts/fresh-install.sh
